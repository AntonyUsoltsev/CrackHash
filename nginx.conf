events {
  worker_connections 1024;
}
http {
  upstream workers {
    server worker:8902;
  }
  server {
    listen 80;
    server_name  manager;
    location / {
         proxy_pass http://worker:8902;
         proxy_connect_timeout 600s;
         proxy_send_timeout 600s;
         proxy_read_timeout 600s;
    }
  }
}
